<!DOCTYPE html>
<html lang="en">

<body>
      <div >

       <script>
        //Task 1
        const employees = [ { id: 1, name: "John", salary: 25000 }, { id: 2, name: "David", salary: 45000 }, { id: 3, name: "Sam", salary: 60000 }, { id: 4, name: "Peter", salary: 30000 } ]
         
        const employeeList = document.getElementById("employeeList");
        
       const data = employees.filter(employee => employee.salary > 40000)
       
        data.forEach(employee => {
            const listItem = document.createElement("li");
            listItem.textContent = `${employee.name} - $${employee.salary}`;
            employeeList.appendChild(listItem);
        });
       //Task 2

       const users = [ { id: 1, name: "Sudhan" }, { id: 2, name: "Kumar" }, { id: 3, name: "Ravi" } ]
       
       const userList = document.getElementById("userList");

       const userdetail = users.find((e)=> e.id === 2)

       const newelement = document.createElement("li")

       newelement.innerHTML = userdetail.name

       userList.appendChild(newelement)

products.map((e,i)=>{
